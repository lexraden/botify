    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid {{c.border}};">

    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid {{c.border}};">
      <div style="width: 48px; height: 48px; border-radius: 13px; background: {{c.surface2}}; display: flex; align-items: center; justify-content: center; font-size: 27px; flex-shrink: 0;">📕</div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <div style="font-size: 15px; font-weight: 700;">Гайд по обжарке <span style="color: {{c.accent}};">×1</span></div>
        <div style="font-size: 13px; font-weight: 600; color: {{c.sub}};">PDF, придёт в чат после оплаты</div>
      </div>
      <div style="font-size: 15px; font-weight: 800;">15.00</div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0;">
      <div style="font-size: 16px; font-weight: 800;">Итого</div>
      <div style="font-size: 18px; font-weight: 800;">19 USDT</div>
    </div>
  </div>

  <div style="margin: 14px 20px 0 20px; background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 18px; padding: 14px 16px; color: {{c.sub}}; font-size: 15px; font-weight: 600; min-height: 66px;">Комментарий к заказу…</div>

  <div style="margin: 14px 20px 0 20px; background: {{c.accentSoft}}; border-radius: 16px; padding: 13px 14px; display: flex; gap: 10px; align-items: flex-start;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>

  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 18px; background: {{c.green}}; color: {{c.onGreen}}; border-radius: 18px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; box-shadow: {{c.shadow}};">
    <span>Оплатить 19 USDT</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const c = dark ? {
      bg: '#0E0F13', surface: '#171921', surface2: '#20232E',
      border: 'rgba(255,255,255,0.09)', text: '#F4F5F7', sub: '#9AA0AB',
      accent: '#7C6CFF', accentSoft: 'rgba(124,108,255,0.18)',
      green: '#2FD48A', greenSoft: 'rgba(47,212,138,0.15)', greenText: '#2FD48A',
      orange: '#FFB454', orangeSoft: 'rgba(255,180,84,0.14)', orangeText: '#FFCB7E',
      red: '#FF6B5E', onGreen: '#062517', shadow: '0 16px 40px rgba(0,0,0,0.45)'
    } : {
      bg: '#F6F7F9', surface: '#FFFFFF', surface2: '#EFF1F5',
      border: '#E8EAF0', text: '#14161B', sub: '#6B7280',
      accent: '#6A58F5', accentSoft: '#ECE9FF',
      green: '#17B877', greenSoft: '#E1F7ED', greenText: '#0E9A62',
      orange: '#F59E1B', orangeSoft: '#FFF3DF', orangeText: '#9A6708',
      red: '#E5544B', onGreen: '#FFFFFF', shadow: '0 14px 34px rgba(20,22,27,0.12)'
    };
    return { c, dark };
  }
}
</script>

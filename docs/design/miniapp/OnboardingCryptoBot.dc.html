<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', -apple-system, system-ui, sans-serif; }
    a { color: #6A58F5; text-decoration: none; } a:hover { color: #5847d6; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: {{c.bg}}; color: {{c.text}}; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 24px 24px 0 24px;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="flex: 1; height: 5px; border-radius: 3px; background: {{c.accent}};"></div>
      <div style="flex: 1; height: 5px; border-radius: 3px; background: {{c.surface2}};"></div>
    </div>
    <div style="font-size: 13px; color: {{c.sub}}; font-weight: 700;">Шаг 1 из 2</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 26px 24px 0 24px;">
    <div style="width: 72px; height: 72px; border-radius: 22px; background: {{c.accentSoft}}; display: flex; align-items: center; justify-content: center;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="3"></rect><path d="M16.5 6V5a2 2 0 0 0-2-2h-9a2 2 0 0 0-2 2v1"></path><circle cx="17" cy="12.5" r="1.4" fill="{{c.accent}}" stroke="none"></circle></svg>
    </div>
    <div style="font-family: 'Unbounded', 'Arial Black', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25;">Куда придут деньги</div>
    <div style="font-size: 16px; font-weight: 600; color: {{c.sub}}; line-height: 1.5;">Выплаты падают на твой баланс в @CryptoBot — выводи на любой кошелёк.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 24px 24px 0 24px;">

    <div style="display: flex; gap: 14px; align-items: center;">
      <div style="width: 30px; height: 30px; border-radius: 10px; background: {{c.surface2}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0;">1</div>
      <div style="font-size: 16px; font-weight: 600; line-height: 1.4;">Открой <b>@CryptoBot</b> по кнопке</div>
    </div>

    <div style="display: flex; gap: 14px; align-items: flex-start;">
      <div style="width: 30px; height: 30px; border-radius: 10px; background: {{c.surface2}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0;">2</div>
      <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
        <div style="font-size: 16px; font-weight: 600; line-height: 1.4; padding-top: 4px;">Нажми <b>/start</b> — этого достаточно</div>
        <div style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 9px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 26px; height: 26px; border-radius: 50%; background: {{c.accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;">CB</div>
            <div style="font-size: 13px; font-weight: 800;">CryptoBot</div>
          </div>
          <div style="background: {{c.surface2}}; border-radius: 12px; border-bottom-left-radius: 4px; padding: 9px 12px; font-size: 13px; font-weight: 600; color: {{c.sub}}; align-self: flex-start;">Добро пожаловать! Здесь твой кошелёк…</div>
          <div style="background: {{c.accentSoft}}; border-radius: 12px; border-bottom-right-radius: 4px; padding: 9px 12px; font-size: 13px; color: {{c.accent}}; align-self: flex-end; font-weight: 800;">/start</div>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 14px; align-items: center;">
      <div style="width: 30px; height: 30px; border-radius: 10px; background: {{c.surface2}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0;">3</div>
      <div style="font-size: 16px; font-weight: 600; line-height: 1.4;">Вернись и нажми «Готово»</div>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 16px 24px 28px 24px;">
    <div style="background: {{c.accent}}; color: #FFFFFF; border-radius: 16px; height: 54px; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 16px; font-weight: 800;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
      <span>Открыть @CryptoBot</span>
    </div>
    <div style="background: {{c.surface2}}; color: {{c.text}}; border-radius: 16px; height: 54px; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 16px; font-weight: 800;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{c.greenText}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
      <span>Готово, я нажал /start</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const c = dark ? {
      bg: '#0E0F13', surface: '#171921', surface2: '#20232E',
      border: 'rgba(255,255,255,0.09)', text: '#F4F5F7', sub: '#9AA0AB',
      accent: '#7C6CFF', accentSoft: 'rgba(124,108,255,0.18)',
      green: '#2FD48A', greenSoft: 'rgba(47,212,138,0.15)', greenText: '#2FD48A',
      orange: '#FFB454', orangeSoft: 'rgba(255,180,84,0.14)', orangeText: '#FFCB7E',
      red: '#FF6B5E', onGreen: '#062517', shadow: '0 16px 40px rgba(0,0,0,0.45)'
    } : {
      bg: '#F6F7F9', surface: '#FFFFFF', surface2: '#EFF1F5',
      border: '#E8EAF0', text: '#14161B', sub: '#6B7280',
      accent: '#6A58F5', accentSoft: '#ECE9FF',
      green: '#17B877', greenSoft: '#E1F7ED', greenText: '#0E9A62',
      orange: '#F59E1B', orangeSoft: '#FFF3DF', orangeText: '#9A6708',
      red: '#E5544B', onGreen: '#FFFFFF', shadow: '0 14px 34px rgba(20,22,27,0.12)'
    };
    return { c, dark };
  }
}
</script>
</body>
</html>

<!doctype html>

  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 40px 24px 0 24px;">

  </div>

  <div style="display: flex; align-items: center; justify-content: center; padding: 40px 24px 0 24px; position: relative;">

      <div style="width: 96px; height: 96px; border-radius: 20px; background: {{c.surface2}}; display: flex; align-items: center; justify-content: center; font-size: 56px; align-self: center;">📕</div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 15px; font-weight: 800;">Гайд по обжарке</div>
        <div style="font-size: 13px; font-weight: 600; color: {{c.sub}};">digital · придёт в чат</div>
      </div>
      <div style="background: {{c.accent}}; color: #FFFFFF; border-radius: 13px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;">15 USDT</div>

    <div style="position: absolute; right: 34px; top: 12px; background: {{c.greenSoft}}; color: {{c.greenText}}; border: 1px solid {{c.border}}; border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; transform: rotate(3deg); backdrop-filter: blur(4px);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
      <span style="font-size: 13px; font-weight: 800;">Оплачено</span>

  </div>

  <div style="display: flex; gap: 8px; justify-content: center; padding: 36px 24px 0 24px;">
    <div style="background: {{c.surface2}}; color: {{c.text}}; border-radius: 20px; padding: 9px 14px; font-size: 13px; font-weight: 700;">Бот-витрина</div>
    <div style="background: {{c.surface2}}; color: {{c.text}}; border-radius: 20px; padding: 9px 14px; font-size: 13px; font-weight: 700;">USDT-оплата</div>
    <div style="background: {{c.surface2}}; color: {{c.text}}; border-radius: 20px; padding: 9px 14px; font-size: 13px; font-weight: 700;">Своя база</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px 28px 24px;">
    <div style="background: {{c.accent}}; color: #FFFFFF; border-radius: 16px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 800;">
      <span>Начать</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: {{c.sub}}; text-align: center;">2 шага · ~10 минут</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const c = dark ? {
      bg: '#0E0F13', surface: '#171921', surface2: '#20232E',
      border: 'rgba(255,255,255,0.09)', text: '#F4F5F7', sub: '#9AA0AB',
      accent: '#7C6CFF', accentSoft: 'rgba(124,108,255,0.18)',
      green: '#2FD48A', greenSoft: 'rgba(47,212,138,0.15)', greenText: '#2FD48A',
      orange: '#FFB454', orangeSoft: 'rgba(255,180,84,0.14)', orangeText: '#FFCB7E',
      red: '#FF6B5E', onGreen: '#062517', shadow: '0 16px 40px rgba(0,0,0,0.45)'
    } : {
      bg: '#F6F7F9', surface: '#FFFFFF', surface2: '#EFF1F5',
      border: '#E8EAF0', text: '#14161B', sub: '#6B7280',
      accent: '#6A58F5', accentSoft: '#ECE9FF',
      green: '#17B877', greenSoft: '#E1F7ED', greenText: '#0E9A62',
      orange: '#F59E1B', orangeSoft: '#FFF3DF', orangeText: '#9A6708',
      red: '#E5544B', onGreen: '#FFFFFF', shadow: '0 14px 34px rgba(20,22,27,0.12)'
    };
    return { c, dark };
  }
}
</script>
